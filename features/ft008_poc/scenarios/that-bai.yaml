schemaVersion: 4
meta:
  id: that-bai
  title: Thất bại — bộ điều khiển từ chối, phản hồi mơ hồ, đề cử hết hạn
  description: 'Bốn nhánh hỏng, và cùng một luật chạy qua cả bốn: trợ lý tuyệt đối
    không được báo thành công cho một việc nó chưa quan sát thấy. Bộ điều khiển từ
    chối lệnh chuyển Eco; một phản hồi mơ hồ không được coi là xác nhận; đề cử hết
    hạn trước khi được xác nhận; và một lần phân phối thất bại không được tính là
    đã phân phối. **`QC-10.1` nay tự dựng được.** P39 thêm bước `vehicleRefuses` cho
    kịch bản, nên việc bộ điều khiển từ chối là một sự kiện kịch bản khai ra chứ không
    còn là một cờ khởi tạo — và ADR-0042 khép vòng, nên lời đồng ý của tài xế thật
    sự tới bộ điều khiển để mà bị từ chối.

    Còn lại một điều chưa dựng được: `driverResponse` có bốn giá trị — accept, reject,
    snooze, silent — nên "mơ hồ" vẫn chưa phải một giá trị phát được (`DEBT-030`),
    và `QC-15.1` vẫn đọc bằng mắt theo bản ghi quyết định.

    '
  durationMs: 160000
