schemaVersion: 4
meta:
  id: im-lang
  title: Im lặng — sáu lần pin chạm 20%, năm lần im vì năm lý do khác nhau
  description: 'Kịch bản khó demo nhất và cần thiết nhất. Pin đi qua mốc 20% sáu lần;
    năm lần trợ lý im, mỗi lần vì một cổng khác của `Bước 5`, và một lần **phải nói**.
    Lần phải nói là lần dễ bị làm sai nhất: điểm đến cách 3 km nhưng không phải Nhà
    và không phải trạm sạc, nên khoảng cách đơn thuần KHÔNG phải lý do chặn. Mỗi lần
    im đòi hai thứ, không phải một: không có đầu ra nào tới tài xế, **và** một bản
    ghi nêu mã lý do cùng chặng — để phân biệt "cân nhắc rồi chọn không nói" với "hỏng
    nên không nói gì". Giữa hai lần, pin phải hồi lên trên ngưỡng ra thì mốc mới được
    vũ trang lại; đó là lý do các bước nâng pin lên 24% nằm xen giữa.

    '
  durationMs: 300000
