  withinMs: 3000
  reaches:
    stage: action
    outcome: ACTED
    reasonCode: soft_threshold_crossed
- id: E2
  label: QC-08.1
  describe: Chưa xác nhận thì chưa có lệnh nào rời hệ thống. Cửa sổ đóng **trước**
    giây 50 — đó là lúc tài xế trả lời, và một khẳng định 'chưa xác nhận' đặt sau
    câu trả lời là một khẳng định không bao giờ sai.
  at: 44000
  forMs: 5000
  absent:
    event: action
    where:
      featureId: FT-007
