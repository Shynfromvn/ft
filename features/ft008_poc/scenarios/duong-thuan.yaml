schemaVersion: 4
meta:
  id: duong-thuan
  title: Đường thuận — pin chạm 20% khi đang chạy, tài xế đồng ý bằng giọng nói
  description: 'UC-01 chạy hết một lượt không nhánh lỗi. Xe đang Driving, điểm đến
    cách 40 km, Assistant Mode = Balanced, mọi dữ liệu còn tươi. Mức pin chạm 20%;
    trợ lý nói đúng một câu chỉ bằng giọng; tài xế xác nhận; và chỉ sau khi bộ điều
    khiển báo Eco Mode đang hoạt động thì trợ lý mới nói là đã chuyển. Đây là kịch
    bản mở đầu mọi buổi demo — nó đi qua đủ bảy chặng.

    '
