schemaVersion: 4
meta:
  id: chiem-quyen
  title: Chiếm quyền — an toàn, cuộc gọi, và màn hình khi xe bắt đầu lăn bánh
  description: 'Ba tình huống trong đó một khuyến nghị Eco hợp lệ phải nhường chỗ.
    Trợ lý không cạnh tranh với cảnh báo an toàn, không chen vào một cuộc gọi, và
    không để lại một mẩu giao diện chạm nào trên màn hình khi xe chuyển sang Driving.
    Tên cũ của kịch bản này là `ft-007-khan-cap`. "Khẩn cấp" mô tả luồng 5% và chế
    độ bảo toàn, hai khái niệm không có trong tài liệu BA chính thức — ở đó chỉ có
    một ngưỡng, 20%, và một chế độ, Eco. Tình huống cuộc gọi (2) đã kiểm chứng được
    từ plan P25 T8: FT-007 khai `phone` và có cổng `call_active`. Tình huống cảnh
    báo an toàn (3) vẫn chưa — miền Safety/System Alert chưa tồn tại ở nền tảng (`DEBT-022`,
    chờ ADR ở plan P27). Hai bước `QC-12.1`/`QC-12.2` vẫn đọc bằng mắt theo bản ghi
    quyết định cho tới lúc đó.

    '
  durationMs: 165000
