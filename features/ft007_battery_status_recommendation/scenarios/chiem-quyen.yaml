expect:
- id: E1
  label: QC-11.1 (nửa yếu)
  describe: 'Suốt cuộc gọi chiếm quyền, **không** hành động nào hướng về tài xế —
    vế ∀ của tiêu chí, và vẫn là tất cả kịch bản này chống đỡ được. Xung `parkedSessionStarted`
    ở giây 82 được thêm vào để trợ lý **được hỏi** giữa cuộc gọi; đo 2026-09-06, nó
    không đủ: lần cắt ngưỡng thứ hai quanh giây 77 cũng không lên nòng thành trigger,
    nên vẫn không ai hỏi. Giữ xung lại vì nó đúng với tình huống và sẽ có tác dụng
    ngay khi `DEBT-182` được trả.'
  at: 82000
  forMs: 25000
  absent:
    event: action
    where:
      featureId: FT-007
