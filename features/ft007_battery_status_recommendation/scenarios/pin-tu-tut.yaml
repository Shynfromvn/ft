expect:
- id: E1
  label: QC-01.1
  describe: 'Pin tụt vì thời gian trôi, không vì ai gõ tay một mức nào — ba đoạn dốc
    là ba đoạn `meta.description` đã mô tả từ đầu. Đoạn thứ nhất cắt 20% quanh giây
    100, sát trước lúc tài xế trả lời ở giây 105, vì cửa sổ trả lời là sáu giây.

    **Cửa sổ rộng 15 giây vì cái neo không chính xác, không vì hành vi chậm.** Mốc
    cắt là một điểm **nội suy** giữa hai keyframe, và lượt phát chạy theo thời gian
    thực nên có nhiễu nhịp. Đo 2026-09-06: cùng file, cùng code, ba lượt cho xanh
    / đỏ / xanh với cửa sổ 4 giây. Trần độ trễ thật của chặng này sống ở `budgets:`
    của `feature.yaml` và được một bài riêng canh — không phải ở đây.'
  at: 95000
  withinMs: 15000
  reaches:
