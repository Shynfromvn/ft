schemaVersion: 4
meta:
  id: pin-tu-tut
  title: Pin tự tụt — xe chạy, trợ lý gợi ý, Eco làm chậm lại, rồi cắm sạc
  description: 'Kịch bản đầu tiên trong đó **không ai gõ tay một mức pin nào** sau
    lúc mở màn. Pin tụt vì thời gian trôi, và ba đoạn của nó có ba độ dốc khác nhau:
    chạy thường, chạy Eco sau khi tài xế đồng ý, và đang nạp.

    Đây là thứ biến `AC-09` từ một lời báo thành một thứ quan sát được. Trước ADR-0045,
    tài xế đồng ý chuyển Eco và **không gì trong mô phỏng đổi** — bộ giả lập chở tín
    hiệu của chiếc xe chứ không sinh ra chúng (`DEBT-034`).

    '
