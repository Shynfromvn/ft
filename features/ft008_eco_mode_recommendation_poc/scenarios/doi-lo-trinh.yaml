schemaVersion: 4
meta:
  id: doi-lo-trinh
  title: Chuyến mới khi pin đã thấp — vế thứ hai của điều kiện kích hoạt
  description: '`ba.md` §3 có hai vế nối bằng "HOẶC", và kịch bản này trình diễn vế
    thứ hai: *"một chuyến đi mới bắt đầu / lộ trình thay đổi trong khi SoC đã ở mức
    ≤20%"*.

    Xe **khởi động ở 18%** và không đi qua ngưỡng ở bất kỳ giây nào — 18 → 17.8 →
    17.5 → 17.2. Trợ lý nói ở chuyến thứ nhất (mẫu đầu tiên thoả điều kiện tính là
    một lần chuyển), rồi **im lặng suốt phần còn lại của chuyến ấy**. Chuyến kết thúc,
    tài xế đặt điểm đến khác, chuyến thứ hai bắt đầu — và trợ lý lên tiếng lần nữa.

    Lần thứ hai ấy là thứ kịch bản này tồn tại để trình diễn: nó **không** đến từ
    một lần đi qua ngưỡng, vì không có lần nào.

    Đây là kịch bản chứng minh một khoảng lệch đã đóng: trước ADR-0041 hệ thống im
    lặng hoàn toàn ở tình huống này, và im lặng ấy trông hệt một quyết định đúng luật.
    Người xem demo cần thấy nó **nói**, và cần biết vì sao lần này nói.

    '
  durationMs: 120000
