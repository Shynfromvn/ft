expect:
- id: E1
  label: QC-01.4
  describe: Chuyến thứ hai bắt đầu với pin **đã** dưới ngưỡng — nó chưa từng đi qua
    ngưỡng ở bất kỳ frame nào, nên `soft_threshold_crossed` không dùng được. Đúng
    một Candidate cho chuyến mới.
  at: 0
  withinMs: 120000
  reaches:
    stage: action
    outcome: ACTED
- id: E2
  label: QC-01.5
  describe: Một chuyến là một lần nói. Cửa sổ mở **sau** khoảnh khắc Candidate đầu
    tiên (giây 0) chứ không trùm lên nó — `after:` neo vào đúng khoảnh khắc ấy, nên
    một khẳng định `absent` dùng `after:` sẽ luôn thấy chính sự kiện nó vừa neo vào.
  forMs: 60000
  absent:
    event: decision
    where:
      reasonCode: soft_threshold_crossed
  at: 5000
