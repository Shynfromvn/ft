schemaVersion: 4
meta:
  id: vong-khep-kin
  title: Vòng khép kín — tài xế đồng ý, bộ điều khiển xác nhận, xe ở Eco
  description: 'Kịch bản đầu tiên đi hết vòng: trợ lý nói, tài xế đồng ý, **bộ điều
    khiển thật sự đổi chế độ**, và chỉ sau khi nó xác nhận thì trợ lý mới báo thành
    công.

    Trước ADR-0042 đoạn cuối ấy không tồn tại. Lệnh `SET_DRIVE_MODE` được sinh ra
    và không ai đọc; `driverResponse` chảy qua cả hệ thống mà không ai chạm tới; và
    "chế độ đã đổi hay chưa" là một `bool` do bên gọi tự khai. Tài xế đồng ý và không
    gì xảy ra.

    Đây là kịch bản để trước mặt vendor khi họ hỏi *"rồi sao nữa"*.

    '
  durationMs: 90000
