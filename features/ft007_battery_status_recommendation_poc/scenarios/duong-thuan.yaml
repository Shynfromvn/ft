schemaVersion: 4
meta:
  id: duong-thuan
  title: Đường thuận — pin chạm 20% khi đang chạy, khuyến nghị được hiển thị
  description: 'UC-01 chạy hết một lượt không nhánh lỗi. Xe online, dữ liệu còn tươi,
    chưa ở Eco Mode, và Session History trống. Mức pin đi qua 20%; S5 tạo đúng một
    Candidate và hiển thị nội dung khuyến nghị. Luồng dừng ở đó — hai nút xác nhận
    có mặt nhưng không ấn được (BA-03), nên không có câu trả lời nào và không lệnh
    nào rời hệ thống.

    Hai mươi factor kế thừa đã bỏ: navigation.* (Navigation ngoài phạm vi),
    safety.* (Safety/ADAS ngoài phạm vi), phone.* (cuộc gọi ngoài phạm vi),
    interaction.* (Assistant Mode ngoài phạm vi), vehicleHealth.systemState (không
    còn là cổng), motion.vehicleInDrive và motion.gearState (không cổng nào đọc sau
    khi parked_and_left bị gỡ), frame.sessionEvent và identity.parkedSessionId
    (không còn khái niệm phiên đỗ), và frame.driverResponse — chủ dự án chốt
    2026-09-08: POC không đặt tín hiệu cho phản hồi tài xế.

    '
  durationMs: 60000
factors:
- key: connectivity.online
  interp: hold
  keys:
  - atMs: 0
    value: true
- key: connectivity.dataAgeSeconds
  interp: hold
  keys:
  - atMs: 0
    value: 1
- key: identity.tripId
  interp: hold
  keys:
  - atMs: 0
    value: chuyen-di-duong-thuan
- key: identity.vehicleId
  interp: hold
  keys:
  - atMs: 0
    value: xe-mac-dinh
# Cùng bốn mốc như bản kế thừa, giữ nguyên có chủ ý: `motion.socPct` nội suy tuyến
# tính nên nó cắt ngưỡng ở giây 43, không ở mốc keyframe. Đổi hình sẽ làm mốc neo
# trong `expect` bên dưới thôi đúng.
- key: motion.socPct
  interp: linear
  keys:
  - atMs: 0
    value: 26
  - atMs: 30000
    value: 22
  - atMs: 45000
    value: 19.6
  - atMs: 55000
    value: 19.4
- key: motion.socDataAgeSeconds
  interp: hold
  keys:
  - atMs: 0
    value: 1
- key: motion.driveMode
  interp: hold
  keys:
  - atMs: 0
    value: NORMAL
expect:
- id: E1
  label: QC-01.1
  describe: 'Pin đi qua 20% khi mọi cổng đều mở — S5 phải tạo đúng một Candidate.
    Neo ở giây 42 chứ không 45: `motion.socPct` nội suy tuyến tính, nên nó cắt ngưỡng
    ở giây 43, không ở mốc keyframe.'
  at: 42000
  withinMs: 3000
  reaches:
    stage: action
    outcome: ACTED
    reasonCode: soft_threshold_crossed
- id: E2
  label: QC-03.1
  describe: 'Sau khi khuyến nghị được hiển thị, không lệnh nào rời hệ thống. Đây là
    khác biệt lớn nhất với bản kế thừa: ở đó tài xế trả lời ở giây 50 và một lệnh đổi chế
    độ được gửi xuống xe. POC không có đường ấy — §Phạm vi loại bỏ thực thi ECU, và
    `publicResult.allowedFields` không khai `actionsToExecute`.'
  at: 46000
  forMs: 14000
  absent:
    event: action
    where:
      featureId: FT-008
