# ══════════════════════════════════════════════════════════════════════════
#  FT-007 — Khuyến nghị chế độ vận hành theo trạng thái pin
#
#  Chín khối đầu là HỢP ĐỒNG DỮ LIỆU kế thừa nguyên vẹn từ tài liệu công ty và
#  reference: được thêm trường, không được bỏ trường. Khối `docs` ở cuối là của
#  riêng repo này — nó khoá code vào tài liệu.
#
#  Yêu cầu:      docs/ba.md          (trong chính gói này)
#  Tiêu chí:     docs/qa-qc.md       (trong chính gói này)
#  Ngưỡng:       features/ft007_battery_status_recommendation/backend/rules.py
# ══════════════════════════════════════════════════════════════════════════

schemaVersion: 2

identity:
  featureId: FT-007
  slug: battery_status_recommendation
  name: "Khuyến nghị chế độ vận hành theo trạng thái pin"
  description: >
    Khi mức pin đi qua ngưỡng thấp trong lúc xe đang vận hành, trợ lý nói đúng
    một câu cho tài xế biết có phải sạc dọc đường không và đề nghị chuyển chế độ
    tiết kiệm. Khi pin xuống mức nguy cấp, xe tự chuyển chế độ bảo toàn và nói
    rõ tài xế phải làm gì tiếp theo.
  # Bật ở task cuối của plan P7, sau khi mọi gate xanh.
  enabled: true
  status: Active
  lastTested: "2026-08-25"

handlers:
  evaluateModel: "features.ft007_battery_status_recommendation.backend.schemas:EvaluateRequest"
  respondModel: "features.ft007_battery_status_recommendation.backend.schemas:RespondRequest"
  evaluate: "features.ft007_battery_status_recommendation.backend.handlers:evaluate"
  respond: "features.ft007_battery_status_recommendation.backend.handlers:respond"
  ingressMode: canonical

agent:
  enabled: true
  adapter: "features.ft007_battery_status_recommendation.backend.agent:BatteryStatusRecommendationAdapter"
  # RESPOND vì BA-23 đòi phân biệt từ chối với không trả lời — mà muốn phân
  # biệt thì phải nhận được câu trả lời.
  operations: [EVALUATE, RESPOND]
  interactionStages: [recommendation]

routing:
  # Hai đường vào, hai câu hỏi khác nhau.
  #
  # `watches` — nền tảng canh tín hiệu hộ và chỉ đánh thức khi nó ĐI QUA mốc.
  # Trước P10 chỗ này khai `CONTEXT_SCAN_REQUESTED`, một sự kiện KHÔNG dòng code
  # nào phát ra, nên tính năng chưa từng chạy nếu không có người gọi tay (C015).
  #
  # Số 20 không có ở đây và sẽ không bao giờ có: brief nói canh tín hiệu nào,
  # `rules.py` giữ con số, `spec.py` nối hai bên (ADR-0013).
  watches:
    - signal: motion.socPct
      direction: FALLING
      operation: EVALUATE
      strategyId: BATTERY_STATUS_RECOMMENDATION
      ruleId: route.battery-status.ft007.v1
      rationaleCodes: [BATTERY_STATUS_CONTEXT_AVAILABLE]
      # Bốn miền này phải có mặt thì watch mới nổ. Khai báo tường minh: một
      # tính năng đọc trường nó chưa từng xin là một tính năng hỏng khi trường
      # đó thôi được gửi.
      requiredPayloadObjects: [batteryState, vehicleState, navigationState, interactionState]

  # `triggers` — câu trả lời của tài xế là một sự kiện có tên, và nó phải tới
  # `respond` chứ không phải `evaluate`: định tuyến nó sang `evaluate` là khởi
  # động lại phần cân nhắc thay vì kết thúc nó.
  triggers:
    - eventType: DRIVER_RESPONDED
      operation: RESPOND
      strategyId: BATTERY_STATUS_RECOMMENDATION
      ruleId: route.battery-status-response.ft007.v1
      rationaleCodes: [BATTERY_STATUS_CONTEXT_AVAILABLE]
      # Rỗng, và đó là con số đúng. `driverResponse` khai ở P10 không phải tên
      # của bất cứ thứ gì: `RespondRequest` mang `candidateId · outcome · channel ·
      # respondedAfterSeconds`, không object lồng nào. Reference cũng không khai
      # object nào cho đường trả lời — nó đi qua `route.user-outcome...` của nền
      # tảng. P12 T5 bật cổng kiểm và chỗ này là thứ đầu tiên nó bắt được.
      requiredPayloadObjects: []

  thresholdProvider: "features.ft007_battery_status_recommendation.backend.rules:watch_thresholds"

engine:
  localPreferenceMining: false
  recordsDeliveredFeedback: false
  # `reject-stale` chứ không phải `none`: tài xế đồng ý lúc pin 19% mà câu trả
  # lời tới khi pin đã 4% thì hành động theo nó là hành động cho một tình huống
  # không còn tồn tại.
  confirmationFreshness:
    mode: reject-stale
    deliveredFeedbackStage: null
  # Chủ đề nghiệp vụ của một đề cử từ tính năng này (Bước 6 của `ba.md`,
  # `BR-02`). Nền tảng giữ chỗ cho nó và không đoán được — liệt kê các chủ đề
  # nghiệp vụ ở nền tảng là nền tảng học từ vựng của tính năng (I2).
  recommendationTopic: Energy and Charging
  # Chưa khai `candidateLifetimeSeconds`: `ba.md` nói đề cử có thời hạn nhưng
  # không nói bao lâu. Để trống thì `DEFAULT_LIFETIME` của nền tảng áp dụng, và
  # một con số bịa ra ở đây sẽ trông như một con số ai đó phê duyệt.

publicResult:
  mode: allowlist
  # `recommendedActions` và `eventCode` thêm ở P36: chúng là vốn từ của tính năng
  # này trên dây S5 → S7 (`docs/architecture/contract-s5-s7.md`). Không khai ở đây
  # thì bộ lọc cắt mất chúng trước khi tới nền tảng, và `Candidate` sinh ra sẽ
  # không có hành động nào — đúng lỗi mà ràng buộc mới của `Candidate` bắt.
  allowedFields: [ok, featureId, resolvedPlan, actionsToExecute, recommendedActions,
                  eventCode, final, confirmation, feedback]

runtime:
  # Năm miền — đúng năm miền `runtime.py` thật sự đọc. Khai báo một miền là
  # một tuyên bố về quyền đọc, nên khai thừa là xin quyền không dùng đến.
  #
  # `identity` bỏ ở P12 T7: projection chưa từng chạm vào miền đó. Contract
  # checker nay từ chối khai thừa.
  #
  # `phone` khai từ P25 T8: `callActive` sống ở đây, `ba.md` đòi cuộc gọi
  # chen ngang chặn được (`E06`/`BR-06`, `ft-007-chiem-quyen`), và `DEBT-020`
  # ghi rõ đây từng là một khoảng lệch chứ không phải một lựa chọn.
  #
  # `connectivity` khai từ P25 T9: `ba.md` Preconditions §2 đòi "Network =
  # Online" là một cổng độc lập, và miền này đã tồn tại ở nền tảng từ
  # `DEBT-033` — tính năng chỉ chưa khai.
  #
  # `vehicleHealth` khai lại từ P25 T16: `systemState` sống ở đây (`DEBT-021`),
  # cần cho cổng "System State = Normal" của `Bước 5`.
  #
  # `safety` khai từ P27 (ADR-0029): cảnh báo an toàn/ADAS đang hoạt động, cần
  # cho cổng `safety_preempted` (`E05`/`BR-05`).
  stateDomains: [motion, navigation, interaction, phone, connectivity, vehicleHealth, safety]
  # Phải chứa mọi `trigger.eventType`, nếu không app không khởi động được.
  events: [DRIVER_RESPONDED]
  projection: "features.ft007_battery_status_recommendation.backend.runtime:project_runtime"
  frontendProjection: ft007

# Bốn đại lượng tài xế nhìn thấy trên tấm kính, cộng một chấm mạng (ADR-0079).
#
# Khác `runtime.stateDomains` ngay trên: kia là **quyền đọc** — bảy miền tính
# năng này được phép thấy để ra quyết định. Đây là tập con của nó mà tài xế
# thật sự nhìn: `interaction.*` và `connectivity.dataAgeSeconds` vào quyết định
# nhưng không ai muốn chúng trên màn hình xe.
#
# Bốn ô này là đúng bốn ô màn hình đã vẽ trước P79, khai lại bằng khai báo thay
# vì bằng một bảng viết tay trong `utils/` của nền tảng. Đổi cơ chế, không đổi
# hình.
#
# `label` là khoá i18n, không phải chuỗi hiển thị — một chuỗi tiếng Việt ở đây
# sẽ là một chuỗi `messages/en.json` không với tới được.
carScreen:
  tiles:
    - factor: motion.socPct
      label: batteryLevel
      format: percent
    - factor: motion.remainingRangeKm
      label: range
      format: distance
    - factor: motion.driveMode
      label: driveMode
      format: text
    - factor: vehicleHealth.systemState
      label: systemState
      format: text
  # Chấm mạng: `connectivity.online` là factor duy nhất trên dải trên có nguồn
  # thật. Phần còn lại của dải — bluetooth, sóng, chuông — không factor nào tả,
  # nên chúng ở lại là hình vẽ và không khai ở đây.
  header:
    - factor: connectivity.online
      label: online
      format: onlineDot
  # Dải phím cứng là phím vật lý dưới màn hình: sưởi ghế, sấy kính, cốp xe.
  # Không cái nào là một đại lượng, nên không có gì để khai.
  footer: []

memory:
  enabled: true
  category: battery_status
  # BA-24: neo vào hồ sơ. Hai người dùng chung một xe có thói quen ngược nhau.
  scope: profile-vehicle-trip
  recallCategories: [battery_status]
  recommendationDomains: [vehicle_operation]
  preferencePatternActions: []
  recommendationStateRequired: false
  writerHook: null
  recommendationHook: "features.ft007_battery_status_recommendation.backend.memory:transitions"
  publicProjectionHook: null
  preferenceContextHook: null
  preferenceProjectionHook: null
  recommendationStateProjectionHook: "features.ft007_battery_status_recommendation.backend.memory:recommendation_state_read_projection"
  localEvidenceHook: null

frontend:
  # Màn hình thật, không phải vỏ generic — `frontend/DetailScreen.tsx` trong
  # chính gói này (P13). Bốn ràng buộc nó thực hiện: `AC-06` Driving chỉ Voice,
  # `AC-07` Parked có Answer Card hai CTA, `AC-13`/`NFR-06` gỡ UI khi chuyển
  # sang Driving, `AC-14` cửa sổ 6 giây.
  #
  # `componentKey` là một KHOÁ, không phải đường dẫn import: trình duyệt tra nó
  # trong registry sinh ra, nên một tính năng không thể bắt frontend nạp một URL
  # tuỳ ý. Khoá không resolve được là lỗi build, không phải vỏ generic (I5).
  kind: custom
  componentKey: BatteryStatusRecommendationDetail

docs:
  # Trong gói, không ở `docs/` gốc repo (P14). Xoá tính năng là xoá cả yêu cầu
  # nghiệp vụ của nó — bất biến I1 theo nghĩa đen.
  #
  # Đường dẫn tính từ gốc repo. `docs-check` đọc ba trường này thay vì đoán vị
  # trí bằng quy ước, nên lần sau muốn đổi chỗ thì sửa đúng ba dòng.
  baDoc: features/ft007_battery_status_recommendation/docs/ba.md
  qcDoc: features/ft007_battery_status_recommendation/docs/qa-qc.md
  # Bắt buộc từ P47 E5 — bộ sinh tài liệu công bố nhặt file này vào nhóm
  # Feature Docs. Viết bằng ngôn ngữ hành vi, không nhắc code hay ADR.
  sequenceDoc: features/ft007_battery_status_recommendation/docs/sequence.md
  # Sáu, không phải bốn. Hai kịch bản của P38/P39 từng thiếu ở đây suốt và
  # không cổng nào bắt, vì cổng chỉ kiểm một chiều — nay nó kiểm cả hai
  # (`docs-check.sh` §4).
  #
  # Đường dẫn tương đối tính từ `scenarios/`, nên một cây con của người viết
  # khai được mà không cần đổi định dạng.
  demoScenarios:
    - chiem-quyen.yaml
    - doi-lo-trinh.yaml
    - duong-thuan.yaml
    - im-lang.yaml
    - pin-tu-tut.yaml
    - that-bai.yaml
    - vong-khep-kin.yaml

# ── điều kiện kích hoạt tính năng này sở hữu ──────────────────────────────
#
# Ba điều kiện này sống trong `backend/src/pa/edge_agent/gate/definitions.py`
# cho tới P46 — tức trong NỀN TẢNG. Không vi phạm bất biến 1 theo nghĩa đen
# (`battery_low` không phải `FT-007`), nhưng ngưỡng 20% có hai bản: một ở
# `rules.py` của gói này, một ở nền tảng. Đổi một cái không đổi cái kia, và
# không cổng nào bắt được.
#
# `placement` nói NƠI kiểm. Cả ba đọc tín hiệu chiếc xe tự phát ra, nên cả ba
# ở `EDGE`. Vế "lộ trình thay đổi" của `ba.md` §3 thì không: điểm đến là tri
# thức thế giới (ADR-0041 điều 2) và S5 hỏi nó qua `WorldPort` — nửa ấy không
# phải một điều kiện kích hoạt.
#
# Không con số nào ở đây, cùng luật với `watches`: `thresholdProvider` ở trên
# giữ ngưỡng, và biên thoát thì KHÔNG AI khai — nó là dải nhiễu của cảm biến
# (ADR-0012), thuộc về chiếc xe.
# Factor tính năng này ĐỌC, và độ tươi nó đòi (ADR-0059 điều 5).
#
# Khác `conditions` ở dưới: kia khai *khi nào thì đáng nói*; đây khai *để trả
# lời được câu ấy, tôi cần đại lượng nào và cũ nhất bao nhiêu*. Hai người đọc
# khác nhau — điều kiện đi tới hai chặng kiểm, danh sách này đi tới bộ biên dịch
# mock và chiến lược lấy dữ liệu ở S5.
#
# `freshness` là MÃ, không phải con số. NFR-01 chốt 10 giây cho telemetry bắt
# buộc và 2 phút cho bối cảnh Navigation; hai con số ấy sống ở `docs/ba.md` và
# đổi ở đó. Viết `10s` vào đây là dựng bản sao thứ hai của một cam kết, và khi
# cam kết đổi thì không gì chỉ ra chỗ phải sửa.
#
# Hai trường navigation ở đây từng nằm dưới `world.*`. Chúng về đúng miền của
# mình từ ADR-0061 điều 2: bộ Navigation nằm trên xe, và nó KHÔNG lên telemetry.
#
# `strategy` là CÁCH lấy, và nó phải được khai chứ không được thừa hưởng: một
# factor không khai nghĩa là *chưa ai nghĩ tới việc lấy thế nào*, và cái đó khác
# hẳn *đã chọn cách đơn giản nhất* (ADR-0054 điều 3). Sáu dòng dưới đây chọn
# `latest` một cách có ý thức — tính năng này quyết trên GIÁ TRỊ ĐANG CÓ, không
# trên một giá trị đã bầu: `NFR-07` đòi số nói với tài xế khớp 100% dữ liệu gốc
# của TBox, và một trung vị thì không khớp cái nào cả.
#
# `neighborhood_vote` là chiến lược sẽ được chọn ở đây ngày ai đó đo được dải
# nhiễu thật của cảm biến SoC (`DEBT-027`). Hôm nay chưa ai đo, nên chọn nó là
# chọn một cửa sổ do nền tảng đặt — xem `DEBT-185`.
factors:
  - key: motion.socPct
    freshness: NFR-01
    strategy: latest
  - key: motion.socDataAgeSeconds
    freshness: NFR-01
    strategy: latest
  - key: navigation.distanceToDestinationKm
    freshness: NFR-01
    strategy: latest
  - key: navigation.nearestChargerKm
    freshness: NFR-01
    strategy: latest
  - key: navigation.destinationType
    freshness: NFR-01
    strategy: latest
  - key: navigation.dataAgeSeconds
    freshness: NFR-01
    strategy: latest

# ── trần latency tính năng này cam kết ────────────────────────────────────
#
# Sáu dòng, khớp từng con số với bảng NFR của `docs/ba.md`. Đây là **nhà duy
# nhất** của ngân sách latency trong repo: nền tảng giữ tên chặng và mã, con số
# giây sống ở đây (ADR-0056; ADR-0063 điều 4 đã gỡ `tolerance: NFR-nn` khỏi file
# kịch bản, nên không còn chỗ thứ hai).
#
# Hai câu hỏi khác nhau và chúng KHÔNG gặp nhau ở đây:
#   *"hệ thống có hành xử đúng không"*  → khối `expect:` của kịch bản
#   *"hệ thống có kịp trần không"*      → khối này, cộng span đặt tên theo NFR
# Chúng gặp nhau trong BÁO CÁO CHẠY, không trong file kịch bản.
#
# `NFR-02 + NFR-03 + NFR-04 = NFR-05` — 1 + 1 + 1 = 3. Một đẳng thức được thiết
# kế, không phải ba con số rời tình cờ khớp; `spec/budgets.py` biến nó thành một
# cổng lúc dựng `FeatureSpec`, và nổ có nêu tên ba mã cộng tổng thực tế.
#
# `NFR-01` khai MỘT con số ở đây trong khi `ba.md` cho nó HAI (telemetry ≤10s,
# bối cảnh Navigation ≤2 phút). Con số chặt hơn là con số ghi — `DEBT-173` giữ
# vế Navigation, vì nó cần một tên chặng thứ hai mà danh mục chưa có.
budgets:
  - nfr: NFR-01
    span: telemetry.freshness
    budgetS: 10.0
  - nfr: NFR-02
    span: s5.decide
    budgetS: 1.0
  - nfr: NFR-03
    span: s7.route
    budgetS: 1.0
  - nfr: NFR-04
    span: s6.deliver
    budgetS: 1.0
  - nfr: NFR-05
    span: e2e
    budgetS: 3.0
  # Đo ở trình duyệt, nên chưa tiến trình backend nào ghi span này. Khai vẫn
  # đúng: `GET /api/v1/qc/latency/{runId}` trả `unmeasured` cho nó, và *"NFR này
  # không ai kiểm"* là một dòng đọc được — khác hẳn một chỗ trống.
  - nfr: NFR-06
    span: ui.dismiss
    budgetS: 0.1

conditions:
  - id: parked_and_left
    placement: EDGE
    scopeSignal: [identity, parkedSessionId]
    # Bốn, không phải năm (ADR-0028): `assistant_is_available` chuyển hẳn sang
    # chặng phát ngôn. `is_online` ở cả hai chặng, và giao nhau ấy có chủ ý —
    # ở đây là bối cảnh, ở kia là quyền.
    guards:
      - leafId: gear
        builtin: gear_is_park
      - leafId: mode
        builtin: mode_is_proactive
      - leafId: session
        builtin: in_parked_session
      - leafId: online
        builtin: is_online
    expression:
      leafId: boundary
      op: boundary_crossed
      kind: parkedSessionStarted

  - id: battery_low
    # **CLOUD, không EDGE** — chủ dự án chốt 2026-09-07: lần cắt ngưỡng SoC là
    # một phép so trên dữ liệu telemetry cloud, không trên bức ảnh tức thời của
    # chiếc xe. Đường đi: S10 ghi số đo → báo `state_changed` lên hub → S5 đọc
    # lại qua `SignalQueryPort` → `MilestoneResolver` quyết, sau khi hai `guards`
    # bên dưới chạy bằng **cùng** hàm cổng ở xe chạy (ADR-0070, P72).
    #
    # Hai điều kiện `boundary_crossed` bên cạnh ở lại `EDGE`: ranh giới phiên và
    # chuyến là thứ **chiếc xe** quan sát, và ADR-0026 vẫn đúng — nó nói điều
    # kiện *được phép* canh ở edge, không nói phải.
    placement: CLOUD
    # Chuyến đi, không phải phiên đỗ: xe đang chạy thì chưa có phiên đỗ nào.
    scopeSignal: [identity, tripId]
    guards:
      - leafId: mode
        builtin: mode_allows_proactive
      - leafId: online
        builtin: is_online
    expression:
      leafId: soc
      # `motion.socPct`, không phải `vehicleHealth`: mức pin đổi theo chuyển
      # động, còn `vehicleHealth` giữ những thứ đổi theo tuổi của xe. Đọc nhầm
      # chỗ là cách một luật im lặng mãi mãi mà không lỗi ở đâu cả.
      op: threshold_cross
      signal: motion.socPct
      # `lte`, không phải `lt`. `ba.md` nói ngưỡng này bốn lần và cả bốn đều
      # bao gồm chính con số ấy: "SoC = 20%", "≤20%", "SoC chạm mức 20%"
      # (BR-01), "SoC chạm 20%" (AC-01). Với `lt` thì đúng tại 20% — con số
      # tài liệu nêu tên, và con số câu nói đọc lên — hệ thống im lặng
      # (`DEBT-096`).
      comparator: lte

  # Vế THỨ HAI của điều kiện kích hoạt: "một chuyến đi mới bắt đầu / lộ trình
  # thay đổi trong khi SoC đã ở mức ≤20%".
  #
  # Một điều kiện RIÊNG, không phải một nhánh của `battery_low`, và sự tách ấy
  # có lý do đo được: khử trùng lặp khoá vào `(điều kiện, tập)`, nên gộp hai
  # điều kiện vào một id sẽ làm lần bắn thứ hai trong cùng một chuyến bị nuốt
  # như một bản sao. Hai id thì hai lần nói, và đó đúng là điều tài liệu mô tả
  # bằng chữ "HOẶC".
  - id: battery_low_on_new_route
    placement: EDGE
    scopeSignal: [identity, tripId]
    guards:
      - leafId: mode
        builtin: mode_allows_proactive
      - leafId: online
        builtin: is_online
      # "Pin đang thấp" ở TIỀN LỌC, không ở biểu thức, và đó là chỗ đúng của nó
      # (ADR-0028): đó là BỐI CẢNH, không phải cột mốc. Cả hai toán tử số có
      # cạnh đều là *chuyển* — `threshold_cross` bắn khi vừa đi qua rồi ngủ,
      # `continuous_for` bắn một lần mỗi episode — nên không cái nào diễn đạt
      # được "trong khi pin vẫn thấp". `threshold_holds` là dạng MỨC của cùng
      # phép so, và nó thay vị từ dựng sẵn `battery_is_low` mà nền tảng từng
      # phải mang cùng một con số 20 nhúng bên trong.
      - leafId: soc_low
        op: threshold_holds
        signal: motion.socPct
        comparator: lte
    # Cột mốc thật sự chỉ còn một: chuyến đi vừa bắt đầu — thứ chiếc xe biết và
    # BÁO LÊN, không phải thứ edge tự suy ra (ADR-0050).
    expression:
      leafId: trip
      op: boundary_crossed
      kind: tripStarted
